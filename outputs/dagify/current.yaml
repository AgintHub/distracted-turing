dag_type: spec
description: Generated workflow from UI.
name: execute_test_workflow
nodes:
  analyze_test_results:
    agent: false
    description: Performs an objective, rule-based assessment of test outcomes, comparing
      actual results to expected criteria and aggregating pass/fail metrics without
      providing remediation guidance.
    name: analyze_test_results
    nodes_depended_on:
    - collect_test_results
    nodes_dependent_on: []
    output_structure:
    - description: Brief textual summary of the analysis highlighting overall findings.
      key: summary
      type: str
    - description: Total number of test cases evaluated.
      key: total_tests
      type: int
    - description: Count of test cases that met expected outcomes.
      key: passed_tests
      type: int
    - description: Count of test cases that did not meet expected outcomes.
      key: failed_tests
      type: int
    - description: Identifiers or names of the test cases that failed.
      key: failed_test_ids
      type: List[str]
    - description: Overall pass/fail status of the test run (true if all tests passed).
      key: overall_pass
      type: bool
    prd:
      conceptual_info: The analyze_test_results node ingests raw execution data from
        collect_test_results, interprets expected versus actual outcomes per test
        case, and compiles a concise, deterministic report. It is deliberately devoid
        of any recommendation or remedial content, ensuring that downstream nodes
        receive a clean pass/fail verdict for further processing or reporting.
      docstring:
        examples:
        - lines:
          - result = analyze_test_results(execution_logs, error_messages, performance_metrics)
          - print(result['overall_pass'])
          output: True or False depending on test outcomes.
        parameters:
        - description: Raw log entries captured during the test run.
          name: execution_logs
          type: List[str]
        - description: Error messages or exception traces generated during execution.
          name: error_messages
          type: List[str]
        - description: Numeric performance measurements recorded for the test run.
          name: performance_metrics
          type: List[float]
        raises:
        - description: Raised if input lists have mismatched lengths or if expected
            outcome metadata cannot be parsed.
          type: ValueError
        returns:
          description: A dictionary containing summary, total_tests, passed_tests,
            failed_tests, failed_test_ids, and overall_pass.
          type: dict
        summary: Objective analysis of test execution data, producing aggregate pass/fail
          metrics.
    prompt: "You are tasked with performing a rigorous, objective analysis of the\
      \ test execution data supplied by the **collect_test_results** node.\n\nThe\
      \ input will consist of three parallel lists:\n1. **execution_logs** – raw log\
      \ entries per test case.\n2. **error_messages** – any exception traces or failure\
      \ notes.\n3. **performance_metrics** – numeric values such as response time\
      \ and memory usage.\n\nYour objective is to:\n\n1. **Parse** each test case's\
      \ expected outcome embedded in the log metadata.\n2. **Determine** the actual\
      \ outcome: *Passed* if the actual result matches the expected, *Failed* otherwise.\n\
      3. **Aggregate** the results to produce:\n   - A concise textual *summary* highlighting\
      \ overall pass rate and notable anomalies.\n   - Counts of total, passed, and\
      \ failed test cases.\n   - A list of identifiers (or names) for any failed test\
      \ cases.\n   - An overall boolean flag indicating whether the entire suite passed.\n\
      \n**Constraints & Requirements**\n- Do not generate any remediation or recommendation\
      \ text.\n- All outputs must be deterministic and reproducible.\n- Preserve the\
      \ output structure exactly as specified below.\n\n**Output Format** (JSON):\n\
      ```json\n{\n  \"summary\": \"<text>\",\n  \"total_tests\": <int>,\n  \"passed_tests\"\
      : <int>,\n  \"failed_tests\": <int>,\n  \"failed_test_ids\": [\"<id>\", ...],\n\
      \  \"overall_pass\": <bool>\n}\n```\nEnsure that the JSON keys match the names\
      \ exactly and that data types align with the defined primitives.\n\n*Example*:\
      \ If 100 tests are run, 92 pass, 8 fail with IDs `TC-001`, `TC-003`, …, the\
      \ output would be:\n```json\n{\n  \"summary\": \"Out of 100 tests, 92 passed\
      \ and 8 failed. 8 failures observed.\",\n  \"total_tests\": 100,\n  \"passed_tests\"\
      : 92,\n  \"failed_tests\": 8,\n  \"failed_test_ids\": [\"TC-001\", \"TC-003\"\
      , ...],\n  \"overall_pass\": false\n}\n```"
  collect_test_results:
    agent: false
    description: Gathers, processes, and consolidates raw test execution outputs,
      including detailed logs, error messages, and performance metrics from the test
      run, providing a comprehensive test result summary.
    name: collect_test_results
    nodes_depended_on:
    - execute_test_teardown
    nodes_dependent_on: []
    output_structure:
    - description: List of raw execution log entries captured during the test run
      key: execution_logs
      type: List[str]
    - description: List of error messages or exception traces generated during execution
      key: error_messages
      type: List[str]
    - description: Numeric performance measurements (e.g., response times, memory
        usage) recorded for the test run
      key: performance_metrics
      type: List[float]
    - description: Brief textual summary of the collected logs and errors
      key: log_summary
      type: str
    prd:
      conceptual_info: This node aggregates and documents test execution outputs to
        facilitate analysis and reporting, providing insights into test effectiveness,
        performance, and reliability.
      docstring:
        examples:
        - lines:
          - test_run_id = 'TR-123'
          - results = collect_test_results(test_run_id)
          - print(results['execution_logs'])
          output: '[''2023-02-20 14:30:00 INFO: Test started'', ''2023-02-20 14:30:05
            ERROR: Test failed'']'
        parameters:
        - description: Unique identifier for the test run.
          name: test_run_id
          type: str
        raises:
        - description: Raised when the specified test run ID is not found.
          type: TestRunNotFoundError
        returns:
          description: A dictionary containing the collected test execution outputs,
            including logs, errors, and performance metrics.
          type: dict
        summary: Collects and processes test execution outputs, including logs, errors,
          and performance metrics, and returns them in a structured format.
    prompt: Extract, organize, and document all test execution output logs, error
      messages, and performance metrics from the test run, ensuring data is properly
      formatted and easily accessible for analysis and reporting. Specifically, collect
      and process raw logs, categorize error messages by severity and type, and calculate
      key performance indicators such as execution times, memory usage, and throughput.
      Include a brief textual summary of the collected logs and errors, highlighting
      any critical issues or trends that require attention.
  create_test_cases:
    agent: false
    description: Generates a complete, structured list of test cases derived from
      the defined test scope, ensuring coverage of all objectives, constraints, and
      success criteria.
    name: create_test_cases
    nodes_depended_on:
    - identify_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of test case descriptions, each containing steps, input data
        requirements, and expected outcomes, formatted as numbered items.
      key: test_cases
      type: List[str]
    - description: The total number of test cases generated.
      key: total_cases
      type: int
    prd:
      conceptual_info: This node translates high‑level test goals and constraints
        into actionable, traceable test cases that can be directly executed by QA
        teams or automated frameworks. It ensures that every requirement is validated,
        reduces ambiguity, and provides a clear audit trail from scope to execution.
      docstring:
        examples:
        - lines:
          - scope = {
          - '    "goals": ["Verify login", "Ensure data persistence"],'
          - '    "boundaries": ["Maximum input length", "Null value handling"],'
          - '    "success_criteria": ["Login succeeds in 2s", "Data remains after
            restart"],'
          - '    "summary": "Login and persistence test scope."'
          - '}'
          - test_cases, count = create_test_cases(scope)
          output: '[''Test 1: Valid login within 2s using standard credentials.'',
            ''Test 2: Verify data persistence after application restart.'']

            2'
        parameters:
        - description: Dictionary containing 'goals', 'boundaries', 'success_criteria',
            and 'summary' keys as produced by identify_test_scope.
          name: scope_json
          type: dict
        raises:
        - description: Raised when required keys are missing or malformed in the input
            scope.
          type: ValueError
        returns:
          description: A tuple containing the list of test case descriptions and the
            total count.
          type: tuple[List[str], int]
        summary: Create detailed test case descriptions from a test scope definition.
    prompt: "You are a test design engineer. Given the structured output from the\
      \ **identify_test_scope** node, produce a comprehensive set of test cases.\n\
      \nInput format (JSON):\n```json\n{\n  \"goals\": [\"Goal 1\", \"Goal 2\", ...],\n\
      \  \"boundaries\": [\"Boundary 1\", \"Boundary 2\", ...],\n  \"success_criteria\"\
      : [\"Criterion 1\", \"Criterion 2\", ...],\n  \"summary\": \"Brief scope overview\"\
      \n}\n```\n\n**Output**:\n1. **test_cases** – a numbered list of strings. Each\
      \ string must describe:\n   * The purpose of the test relative to a specific\
      \ goal or boundary.\n   * Precise input data requirements (including edge‑case\
      \ values).\n   * Step‑by‑step actions.\n   * Expected outcome and how it satisfies\
      \ one or more success criteria.\n2. **total_cases** – the integer count of test\
      \ cases generated.\n\nThe generated test cases should:\n- Cover all identified\
      \ goals and boundaries.\n- Include positive, negative, boundary, and performance\
      \ scenarios.\n- Be written in clear, executable natural language.\n- Avoid duplication;\
      \ each case should test a distinct condition.\n\nReturn a JSON object exactly\
      \ matching the `output_structure` below.\n\nExample output:\n```json\n{\n  \"\
      test_cases\": [\"Test 1: ...\", \"Test 2: ...\"],\n  \"total_cases\": 2\n}\n\
      ```\n"
  execute_test_setup:
    agent: false
    description: Initialize test execution environment by performing all required
      pre-test configuration steps, loading test data, and initializing test states
      to ensure a stable test environment.
    name: execute_test_setup
    nodes_depended_on:
    - generate_test_data
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier of the prepared test execution environment.
      key: environment_id
      type: str
    - description: Ordered list of configuration actions performed during setup (e.g.,
        "install dependencies", "configure network", "initialize services").
      key: setup_steps
      type: List[str]
    - description: Identifiers or file names of test data assets that were loaded
        into the environment.
      key: loaded_test_data
      type: List[str]
    - description: Flag indicating whether the environment is fully configured and
        ready for test execution.
      key: environment_ready
      type: bool
    prd:
      conceptual_info: This node sets up the environment for test execution by performing
        necessary configuration steps and loading test data generated from the 'generate_test_data'
        node.
      docstring:
        examples:
        - lines:
          - test_data = ['test_data_1.csv', 'test_data_2.json']
          - test_environment = 'test_environment_1'
          - setup_result = execute_test_setup(test_data, test_environment)
          - print(setup_result)
          output: '{''environment_id'': ''env_1'', ''setup_steps'': [''install dependencies'',
            ''configure network''], ''loaded_test_data'': [''test_data_1.csv'', ''test_data_2.json''],
            ''environment_ready'': True}'
        parameters:
        - description: List of filenames or identifiers for the generated test data
            sets.
          name: test_data
          type: List[str]
        - description: Unique identifier of the test environment to be set up.
          name: test_environment
          type: str
        raises:
        - description: Raised when the test environment setup fails due to invalid
            test data or environment configuration issues.
          type: Exception
        returns:
          description: Dictionary containing the environment ID, setup steps, loaded
            test data, and environment readiness flag.
          type: dict
        summary: Initialize the test environment by setting up required configurations
          and loading test data to ensure a stable test environment.
    prompt: Perform comprehensive pre-test configuration by loading test data generated
      from the 'generate_test_data' node, initializing required test states, and executing
      all necessary setup steps to ensure a stable test environment. Validate the
      environment's readiness and prepare it for test execution.
  execute_test_teardown:
    agent: false
    description: Orchestrates a comprehensive rollback of the test environment, removing
      all artifacts and restoring configurations altered during test execution to
      guarantee isolation and repeatability.
    name: execute_test_teardown
    nodes_depended_on:
    - run_test_scenarios
    nodes_dependent_on: []
    output_structure:
    - description: Indicates whether the environment cleanup completed without errors.
      key: cleanup_success
      type: bool
    - description: List of filenames, directories, or resources that were deleted
        during teardown.
      key: removed_artifacts
      type: List[str]
    - description: Any error messages encountered while attempting to remove artifacts
        or reset configurations.
      key: error_messages
      type: List[str]
    prd:
      conceptual_info: The execute_test_teardown node is the final gatekeeper of the
        test lifecycle, ensuring that every side‑effect produced by the run_test_scenarios
        node is fully neutralized.  This guarantees that each test run is isolated,
        repeatable, and free from residual state that could skew results or degrade
        system performance.
      docstring:
        examples:
        - lines:
          - '# Assuming the test environment has been modified by previous steps'
          - result = execute_test_teardown()
          - assert result['cleanup_success'] is True
          - assert len(result['error_messages']) == 0
          output: Test environment cleaned successfully, no errors.
        parameters: []
        raises:
        - description: If critical cleanup steps fail and the environment cannot be
            safely restored.
          type: RuntimeError
        returns:
          description: A dictionary containing cleanup_success (bool), removed_artifacts
            (List[str]), and error_messages (List[str]).
          type: dict
        summary: Restore the test environment to its original state after all test
          scenarios have executed.
    prompt: "After all test scenarios have run, meticulously restore the testing environment\
      \ to its pristine pre‑test state.  \n\n1. Enumerate every temporary file, directory,\
      \ database entry, environment variable, and network service that was introduced\
      \ or altered during the test run.\n2. Safely delete or revert each artifact,\
      \ ensuring no residual data remains that could bias subsequent executions.\n\
      3. Verify that all system configurations, such as registry keys, kernel parameters,\
      \ or container images, have been reset to their original defaults.\n4. Record\
      \ the outcome of each cleanup action, capturing any failures or warnings.\n\
      5. Return a structured summary of the teardown operation, including success\
      \ status, list of removed items, and any error messages.\n\nThe goal is to guarantee\
      \ isolation and repeatability for every test cycle, preventing cross‑contamination\
      \ and ensuring that future runs start from a clean slate."
  generate_test_data:
    agent: false
    description: Synthesizes and validates comprehensive test data files for all test
      cases, ensuring schema fidelity, volume compliance, and environmental readiness
      before test execution.
    name: generate_test_data
    nodes_depended_on:
    - create_test_cases
    - prepare_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: List of filenames or identifiers for the generated test data sets.
      key: test_data_files
      type: List[str]
    - description: Corresponding number of records in each generated test data file.
      key: record_counts
      type: List[int]
    - description: File format or schema type for each generated test data file (e.g.,
        CSV, JSON).
      key: data_formats
      type: List[str]
    - description: Indicates whether all generated data meet the required specifications
        and are ready for use.
      key: is_valid
      type: bool
    prd:
      conceptual_info: The generate_test_data node is the linchpin that bridges test
        design and execution. It produces every data artifact that test cases will
        consume, guaranteeing that each file adheres to the declared schema, respects
        data distribution constraints, and is compatible with the pre‑configured testing
        environment. By incorporating deterministic data generation and rigorous validation,
        the node eliminates flaky tests and ensures reproducible outcomes across CI/CD
        pipelines.
      docstring:
        examples:
        - lines:
          - 'test_cases = [{''name'': ''users'', ''schema'': {''id'': ''int'', ''name'':
            ''str''}, ''count'': 5000, ''format'': ''csv''}]'
          - 'environment_config = {''storage_path'': ''/tmp/test_data'', ''supported_formats'':
            [''csv'', ''json'']}'
          - result = generate_test_data(test_cases, environment_config)
          - print(result['is_valid'])
          output: '[True]'
        parameters:
        - description: Output from the create_test_cases node; each dictionary contains
            schema, volume, and constraint metadata.
          name: test_cases
          type: List[Dict]
        - description: Output from the prepare_test_environment node; includes supported
            file formats, storage paths, and available resources.
          name: environment_config
          type: Dict
        raises:
        - description: Raised when a test case's constraints cannot be satisfied given
            the environment resources.
          type: ValueError
        - description: Raised if file I/O or schema validation fails.
          type: RuntimeError
        returns:
          description: 'A dictionary mapping to the four output fields: test_data_files,
            record_counts, data_formats, and is_valid.'
          type: Dict
        summary: Generate and validate synthetic or curated test data files for all
          defined test cases.
    prompt: "You are a data synthesis specialist. Given the list of test cases produced\
      \ by **create_test_cases** and the environment configuration from **prepare_test_environment**,\
      \ generate all required test data files.\n\n**Requirements**:\n1. For each test\
      \ case, identify the data schema, volume, and constraints (e.g., field ranges,\
      \ uniqueness, foreign key relationships).\n2. Produce synthetic data that satisfies\
      \ those constraints while mimicking realistic distributions (use Gaussian, Zipf,\
      \ or domain‑specific patterns where appropriate).\n3. Store each data set in\
      \ a separate file using the format specified by the test case (CSV, JSON, Parquet,\
      \ etc.).\n4. Validate each file against the target schema, record any discrepancies,\
      \ and ensure every file passes all validation checks.\n5. Generate a summary\
      \ report listing:\n   - filename\n   - record count\n   - file format\n   -\
      \ validity flag (true if schema and constraint checks pass, false otherwise)\n\
      6. If any test case cannot be satisfied (e.g., conflicting constraints or missing\
      \ environment resources), raise an informative exception.\n\n**Output** should\
      \ be a JSON object with the following fields:\n- test_data_files (List[str])\n\
      - record_counts (List[int])\n- data_formats (List[str])\n- is_valid (List[bool])\n\
      \nThe node must run deterministically; use seeded random generators to allow\
      \ reproducibility.\n\nExample: If the test case requires 10,000 customer records\
      \ in CSV format, generate a file `customers_test.csv` with 10,000 rows, validate,\
      \ and mark it as valid."
  generate_test_report:
    agent: false
    description: Creates a formal, objective test evaluation summary by synthesizing
      the high‑level metrics produced by the analyze_test_results step. The report
      consolidates test scope, execution procedures, statistical outcomes, and the
      final pass/fail verdict for consumption by stakeholders and downstream quality
      gates.
    name: generate_test_report
    nodes_depended_on:
    - analyze_test_results
    nodes_dependent_on: []
    output_structure:
    - description: Brief description of the test scope and objectives
      key: test_scope
      type: str
    - description: List of high‑level test procedures or steps that were executed
      key: test_procedures
      type: List[str]
    - description: Objective analysis of the test results, highlighting any deviations
      key: results_analysis
      type: str
    - description: Final pass/fail status of the test suite (true = pass, false =
        fail)
      key: overall_status
      type: bool
    prd:
      conceptual_info: The generate_test_report node distills quantitative test execution
        data into a human‑readable, objective report. It leverages the aggregated
        metrics from analyze_test_results to provide stakeholders with a clear snapshot
        of what was tested, how it was tested, the factual outcome, and the ultimate
        pass/fail decision, without embedding any remediation advice. This separation
        of analysis and reporting ensures that downstream quality gates can consume
        a deterministic pass/fail flag while executives receive a narrative that is
        easy to interpret.
      docstring:
        examples:
        - lines:
          - analysis = {
          - '    "summary": "All tests executed.",'
          - '    "total_tests": 120,'
          - '    "passed_tests": 118,'
          - '    "failed_tests": 2,'
          - '    "failed_test_ids": ["test_user_create_missing_field", "test_auth_token_expiry"],'
          - '    "overall_pass": false'
          - '} '
          - report = generate_test_report(analysis)
          output: "{\n  \"test_scope\": \"Functional regression of API v2 endpoints\
            \ for the user management module\",\n  \"test_procedures\": [\"Unit test\
            \ suite for user CRUD operations\", \"Load testing of authentication endpoint\"\
            ],\n  \"results_analysis\": \"120 tests executed: 118 passed, 2 failed\
            \ (missing field and token expiry). All failures were in edge‑case scenarios;\
            \ no core functionality regressions detected.\",\n  \"overall_status\"\
            : false\n}"
        parameters:
        - description: Dictionary containing analysis metrics from the analyze_test_results
            node.
          name: analysis_result
          type: dict
        raises:
        - description: Raised if required keys are missing from analysis_result.
          type: ValueError
        returns:
          description: JSON object with keys test_scope, test_procedures, results_analysis,
            overall_status.
          type: dict
        summary: Generate a formal test evaluation summary from analysis metrics.
    prompt: "Using the JSON object returned from **analyze_test_results**, generate\
      \ a concise, structured test report with the following fields:\n\n1. **test_scope**\
      \ – A one‑sentence description of the overall test objectives (e.g., \"Functional\
      \ regression of API v2 endpoints for the user management module\").\n2. **test_procedures**\
      \ – A list of the high‑level test procedures that were executed (e.g., \"Unit\
      \ test suite for user CRUD operations\", \"Load testing of authentication endpoint\"\
      ).\n3. **results_analysis** – An objective textual analysis summarizing the\
      \ test run: total tests, passed/failed counts, and any notable deviations (e.g.,\
      \ significant failures in edge‑case scenarios). Avoid subjective language or\
      \ recommendations.\n4. **overall_status** – A boolean indicating the overall\
      \ pass/fail status (true = all tests passed, false = any failure).\n\nThe output\
      \ must be a JSON object containing exactly these keys, each matching the type\
      \ specified in the output structure. Do not include any additional keys or narrative\
      \ outside the JSON.\n\nExample input (from analyze_test_results):\n```json\n\
      {\n  \"summary\": \"All tests executed.\",\n  \"total_tests\": 120,\n  \"passed_tests\"\
      : 118,\n  \"failed_tests\": 2,\n  \"failed_test_ids\": [\"test_user_create_missing_field\"\
      , \"test_auth_token_expiry\"],\n  \"overall_pass\": false\n}\n```\n\nExample\
      \ output:\n```json\n{\n  \"test_scope\": \"Functional regression of API v2 endpoints\
      \ for the user management module\",\n  \"test_procedures\": [\"Unit test suite\
      \ for user CRUD operations\", \"Load testing of authentication endpoint\"],\n\
      \  \"results_analysis\": \"120 tests executed: 118 passed, 2 failed (missing\
      \ field and token expiry). All failures were in edge‑case scenarios; no core\
      \ functionality regressions detected.\",\n  \"overall_status\": false\n}\n```"
  identify_test_scope:
    agent: false
    description: Defines the strategic framework for a test run by specifying explicit
      goals, scope boundaries, measurable success criteria, and a concise summary
      that guides test case creation and environment setup.
    name: identify_test_scope
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of specific test goals to be achieved
      key: goals
      type: List[str]
    - description: List of limits and constraints defining what is in‑scope and out‑of‑scope
        for the test
      key: boundaries
      type: List[str]
    - description: List of measurable criteria that determine when the test is considered
        successful
      key: success_criteria
      type: List[str]
    - description: Brief textual summary of the overall test scope
      key: summary
      type: str
    prd:
      conceptual_info: The identify_test_scope node establishes the strategic vision
        for a test cycle. It captures the intent, constraints, and acceptance metrics
        that direct subsequent test design, environment provisioning, and execution
        planning.
      docstring:
        examples:
        - lines:
          - 'scope = identify_test_scope(context={''business_goal'': ''reduce API
            latency''})'
          - print(scope['summary'])
          output: The test focuses on API latency reduction, targeting a 20% improvement
            over the current baseline.
        parameters:
        - description: Optional contextual information such as business goals, regulatory
            mandates, or prior test results that influence scope definition.
          name: context
          type: dict
        raises:
        - description: Raised if required contextual information is missing or insufficient
            to define a coherent scope.
          type: ValueError
        returns:
          description: A dictionary with keys 'goals', 'boundaries', 'success_criteria',
            and 'summary', each containing the respective scoped content.
          type: dict
        summary: Generate a structured definition of test objectives, boundaries,
          and success criteria.
    prompt: "You are tasked with defining a rigorous test scope for the upcoming test\
      \ cycle. Deliver a clear, structured definition that includes:\n1. A concise\
      \ list of **specific test goals** that align with business objectives and regulatory\
      \ requirements.\n2. A **boundaries** section that explicitly lists what is **in‑scope**\
      \ and what is **out‑of‑scope**, including constraints such as data volume limits,\
      \ platform versions, and third‑party integration boundaries.\n3. A set of **measurable\
      \ success criteria** expressed as quantitative or qualitative thresholds (e.g.,\
      \ defect density < 0.5%, performance latency < 200 ms, compliance pass rate\
      \ ≥ 99%).\n4. A one‑paragraph **summary** that captures the overall intent,\
      \ critical constraints, and expected impact of the defined scope.\n\nThe output\
      \ must be a JSON object with the following keys: \"goals\", \"boundaries\",\
      \ \"success_criteria\", and \"summary\". Each key should map to a list or string\
      \ as specified in the output structure.\n\nExample output format:\n{\n  \"goals\"\
      : [\"Ensure all new API endpoints meet latency targets\"],\n  \"boundaries\"\
      : [\"In‑scope: v1.3 APIs; Out‑of‑scope: legacy v1.1 APIs\"],\n  \"success_criteria\"\
      : [\"Latency < 200 ms for 95% of requests\"],\n  \"summary\": \"Test focuses\
      \ on v1.3 API performance and reliability, excluding legacy components.\"\n\
      }\n\nAdhere strictly to the output format; no additional keys or text should\
      \ be present."
  prepare_test_environment:
    agent: false
    description: Automates the provisioning, configuration, and validation of the
      entire testing infrastructure—hardware, software, network, and isolation layers—ensuring
      a repeatable, compliant environment that satisfies the test scope constraints.
    name: prepare_test_environment
    nodes_depended_on:
    - identify_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: Ordered list of actions performed to configure the testing environment
      key: setup_steps
      type: List[str]
    - description: Names and versions of software components installed in the environment
      key: installed_software
      type: List[str]
    - description: Details of hardware resources allocated or configured for testing
      key: hardware_configuration
      type: List[str]
    - description: Outcome of each validation step (true if successful, false otherwise)
        in the same order as validation_steps
      key: validation_results
      type: List[bool]
    - description: Descriptions of the validation checks performed to verify the environment
        setup
      key: validation_steps
      type: List[str]
    - description: Concise summary of the prepared testing environment and its readiness
        status
      key: environment_summary
      type: str
    prd:
      conceptual_info: This node is the gatekeeper that guarantees a consistent, reliable,
        and compliant test environment before any test data or cases are introduced.
        It abstracts the complexities of infrastructure provisioning into a single,
        repeatable step, thereby reducing manual errors, speeding up test cycles,
        and enabling continuous integration pipelines to run smoothly.
      docstring:
        examples:
        - lines:
          - from workflow.nodes.prepare_test_environment import prepare_test_environment
          - '# Assume ''scope'' dict obtained from identify_test_scope node'
          - result = prepare_test_environment(scope)
          - print(result['environment_summary'])
          output: '"Environment ready: 8 vCPUs, 32GB RAM, PostgreSQL 13.4, all validations
            passed."'
        parameters:
        - description: Dictionary containing test objectives, required resources,
            and success criteria as produced by the 'identify_test_scope' node.
          name: scope
          type: dict
        raises:
        - description: Raised if hardware allocation fails or required quota is exceeded.
          type: EnvironmentProvisionError
        - description: Raised when a critical dependency cannot be installed or verified.
          type: SoftwareInstallationError
        - description: Raised when any validation step reports a failure.
          type: ValidationFailedError
        returns:
          description: Structured JSON with setup steps, installed software, hardware
            configuration, validation results, and a summary.
          type: dict
        summary: Provision, configure, and validate the testing environment based
          on a predefined test scope.
    prompt: 'Using the test scope defined in the previous node, orchestrate a fully
      automated, reproducible test environment.

      1. **Hardware provisioning** – Allocate the exact compute, storage, and networking
      resources required (e.g., VM types, GPU count, high‑speed SSDs, network bandwidth).
      Capture resource identifiers.

      2. **Software stack installation** – Install the precise versions of operating
      system packages, runtime environments, databases, message queues, and any vendor‑specific
      tools. Record each component’s name and version.

      3. **Configuration** – Apply system‑level settings (kernel parameters, security
      policies), application configuration files, and network routing rules. Validate
      that configuration changes are idempotent.

      4. **Environment isolation** – Set up container orchestration (Docker/Kubernetes)
      or virtualized sandboxes to ensure repeatability across runs.

      5. **Validation suite** – Execute a predefined set of health‑check scripts (e.g.,
      `healthcheck.sh`, `db_connectivity_test.py`) and record pass/fail outcomes.

      6. **Documentation** – Generate a concise summary that lists all provisioning
      steps, installed components, and validation results.

      Return a JSON payload containing the following keys:

      - setup_steps

      - installed_software

      - hardware_configuration

      - validation_steps

      - validation_results

      - environment_summary'
  run_test_scenarios:
    agent: false
    description: Orchestrates the systematic execution of every test case in the suite,
      capturing raw logs, pass/fail status, and performance metrics in a deterministic,
      reproducible manner.
    name: run_test_scenarios
    nodes_depended_on:
    - execute_test_setup
    nodes_dependent_on: []
    output_structure:
    - description: Identifiers of the test cases that were executed
      key: test_case_ids
      type: List[str]
    - description: Pass/fail status for each test case; true indicates pass, false
        indicates fail
      key: execution_status
      type: List[bool]
    - description: Raw log output captured for each test case execution
      key: execution_logs
      type: List[str]
    - description: Duration of each test case execution in seconds
      key: execution_times_seconds
      type: List[float]
    prd:
      conceptual_info: The run_test_scenarios node acts as the execution engine for
        the test suite. It consumes the fully prepared test environment from execute_test_setup,
        iteratively runs each test case, and aggregates low‑level execution artifacts.
        These artifacts are later used by reporting and analytics nodes to generate
        summaries, detect regressions, and measure performance trends.
      docstring:
        examples:
        - lines:
          - results = run_test_scenarios(environment_id='env_123', test_cases=[{'id':'tc01','cmd':'pytest
            -k tc01'}, {'id':'tc02','cmd':'pytest -k tc02'}])
          - print(results['execution_status'])
          output: '[True, False]'
        parameters:
        - description: Identifier of the test environment prepared by execute_test_setup.
          name: environment_id
          type: str
        - description: A list of test case definitions, each containing an 'id' and
            execution command or reference.
          name: test_cases
          type: List[dict]
        raises:
        - description: Raised if the environment_id is invalid or the test environment
            is not ready.
          type: RuntimeError
        - description: Raised when a test case exceeds its allocated timeout threshold.
          type: TimeoutError
        returns:
          description: A dictionary containing lists of test_case_ids, execution_status,
            execution_logs, and execution_times_seconds.
          type: dict
        summary: Execute all test cases and return raw execution data.
    prompt: 'Execute all test cases defined in the current test suite within the environment
      prepared by the preceding node. For each test case:

      1. Run the test harness (CLI or API call) using the environment ID and loaded
      test data.

      2. Capture the raw log output and any stdout/stderr streams.

      3. Record the exit code; treat non‑zero exit codes or assertion failures as
      a failure.

      4. Measure the elapsed wall‑clock time from start to finish.

      5. Append the results to the cumulative output list.

      After processing all test cases, return the aggregated data structure.


      The prompt should enforce the following constraints:

      - No intermediate interpretation or summarization of logs – raw logs only.

      - Use precise, deterministic timestamps (ISO 8601 UTC) for start and end times.

      - Ensure the node is deterministic: identical inputs must always produce the
      same outputs.

      - Handle timeouts gracefully by marking the test case as failed and logging
      a timeout message.

      - Provide clear, machine‑readable JSON for downstream consumption.'
