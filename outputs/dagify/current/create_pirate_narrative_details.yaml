dag_type: plain_text
description: Builds a self-contained pirate-themed narrative from world creation to
  final compilation, including characters, setting, adventure structure, and resolution.
name: create_pirate_narrative
nodes:
  compile_complete_narrative:
    agent: false
    description: Final assembly of all narrative elements
    name: compile_complete_narrative
    nodes_depended_on:
    - write_chapter_1
    - write_chapter_2
    - write_chapter_3
    - write_chapter_4
    - write_chapter_5
    - write_climax_and_resolution
    - write_epilogue
    - create_treasure_map
    - create_pirate_lore
    nodes_dependent_on: []
    prompt: Assemble final narrative with appropriate formatting, chapter intermissions,
      map placements, and lore annotations. Include appendix with world/character/ship
      guides.
  create_pirate_lore:
    agent: false
    description: Develop fictional historical background for the pirate world
    name: create_pirate_lore
    nodes_depended_on:
    - develop_narrative_outline
    nodes_dependent_on:
    - develop_narrative_outline
    prompt: Compose fictional pirate code, seafaring legends, and historical events
      that contextualize current plot elements. Include 3 canonical 'tales from the
      log'.
  create_pirate_world:
    agent: false
    description: Design the seascape and archipelagos for the narrative
    name: create_pirate_world
    nodes_depended_on: []
    nodes_dependent_on:
    - plan_adventure_quest
    prompt: Create a detailed pirate world with geographic features (continents, islands,
      straits) and unique natural phenomena. Specify 3-5 environmental hazards or
      points of interest.
  create_treasure_map:
    agent: false
    description: Design the central map driving the adventure
    name: create_treasure_map
    nodes_depended_on:
    - develop_narrative_outline
    nodes_dependent_on:
    - develop_narrative_outline
    prompt: Create a hand-drawn style treasure map with annotated landmarks, riddles,
      and trap markers. Include 3 distinct clues that resolve in later chapters.
  design_pirate_ship:
    agent: false
    description: Create the primary vessel for the pirate adventure
    name: design_pirate_ship
    nodes_depended_on: []
    nodes_dependent_on:
    - plan_adventure_quest
    prompt: Design a unique pirate ship with specific technical attributes (sails/crew
      capacity) and magical or mechanical modifications. Name the ship and specify
      its vulnerabilities.
  develop_main_characters:
    agent: false
    description: Establish core pirate characters and their relationships
    name: develop_main_characters
    nodes_depended_on: []
    nodes_dependent_on:
    - plan_adventure_quest
    prompt: Design 4 key pirate characters with distinct traits, personal stakes,
      and relationships. Include one central antagonist and one ally with hidden motives.
  develop_narrative_outline:
    agent: false
    description: Full story architecture with pacing and resolution cues
    name: develop_narrative_outline
    nodes_depended_on:
    - plan_adventure_quest
    nodes_dependent_on:
    - write_chapter_1
    - write_chapter_2
    - write_chapter_3
    - write_chapter_4
    - write_chapter_5
    - create_treasure_map
    - create_pirate_lore
    prompt: Expand adventure outline into a 5-chapter structure with pacing notes,
      interchapter cliffhangers, and thematic reinforcement markers.
  plan_adventure_quest:
    agent: false
    description: Structural outline of the main adventure arc
    name: plan_adventure_quest
    nodes_depended_on:
    - create_pirate_world
    - develop_main_characters
    - design_pirate_ship
    nodes_dependent_on:
    - develop_narrative_outline
    prompt: 'Plan a 3-act pirate adventure including: 1) initial conflict discovery
      2) mid-story turning point 3) final confrontation setup. Link to created world
      elements.'
  write_chapter_1:
    agent: false
    description: First narrative chapter covering world intro and initial conflict
    name: write_chapter_1
    nodes_depended_on:
    - develop_narrative_outline
    nodes_dependent_on:
    - develop_narrative_outline
    prompt: Write Chapter 1 establishing pirate world, characters, and initial motivator.
      Focus on first 30% of narrative arc with clear setup of future challenges.
  write_chapter_2:
    agent: false
    description: Second narrative chapter with escalating challenges
    name: write_chapter_2
    nodes_depended_on:
    - develop_narrative_outline
    nodes_dependent_on:
    - develop_narrative_outline
    prompt: Write Chapter 2 introducing first major obstacle and developing character
      relationships. Establish midpoint tension and complicate initial objectives.
  write_chapter_3:
    agent: false
    description: Third narrative chapter with pivotal turning point
    name: write_chapter_3
    nodes_depended_on:
    - develop_narrative_outline
    nodes_dependent_on:
    - develop_narrative_outline
    prompt: Write Chapter 3 featuring critical plot reversal or revelation. Resolve
      one secondary storyline while deepening the central conflict.
  write_chapter_4:
    agent: false
    description: Fourth narrative chapter building toward climax
    name: write_chapter_4
    nodes_depended_on:
    - develop_narrative_outline
    nodes_dependent_on:
    - develop_narrative_outline
    prompt: Write Chapter 4 with escalating stakes and major character transformation.
      Include direct confrontation with secondary antagonists.
  write_chapter_5:
    agent: false
    description: Fifth narrative chapter with final confrontation
    name: write_chapter_5
    nodes_depended_on:
    - develop_narrative_outline
    nodes_dependent_on:
    - develop_narrative_outline
    - write_climax_and_resolution
    prompt: Write Chapter 5 resolving primary conflicts while leaving lingering narrative
      elements. Establish setup for potential sequels.
  write_climax_and_resolution:
    agent: false
    description: Final confrontation and story conclusion
    name: write_climax_and_resolution
    nodes_depended_on:
    - develop_narrative_outline
    nodes_dependent_on:
    - write_epilogue
    prompt: Write the ultimate showdown sequence resolving primary conflicts. Include
      3 character-defining choices and final world state implications.
  write_epilogue:
    agent: false
    description: Final chapter tying loose ends and establishing legacy
    name: write_epilogue
    nodes_depended_on:
    - write_climax_and_resolution
    nodes_dependent_on:
    - compile_complete_narrative
    prompt: Write epilogue showing character fates and world changes post-crisis.
      Include 2-3 open-ended questions or mysteries.
