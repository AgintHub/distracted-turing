dag_type: plain_text
description: A highly concurrent workflow for designing, executing, and validating
  tests through atomic, stateless, parallelizable steps
name: test_workflow
nodes:
  clean_up_test_environment:
    agent: false
    description: Remove temporary test data and restore production state
    name: clean_up_test_environment
    nodes_depended_on:
    - prepare_test_environment
    nodes_dependent_on: []
    prompt: Delete all test-specific configurations, reset databases, and ensure the
      environment is restored to its pre-test state. Confirm through basic environment
      validation checks.
  create_test_cases:
    agent: false
    description: Design individual test scenarios based on requirements
    name: create_test_cases
    nodes_depended_on:
    - define_test_scope
    nodes_dependent_on:
    - execute_test_cases
    - generate_test_report
    prompt: Generate 10-15 distinct test cases covering requirements, each with preconditions,
      steps, and expected outcomes. Format as a numbered list with test case identifiers.
  define_test_scope:
    agent: false
    description: Establish boundaries and constraints for the testing effort
    name: define_test_scope
    nodes_depended_on: []
    nodes_dependent_on:
    - gather_test_requirements
    - create_test_cases
    - prepare_test_environment
    prompt: Create a test scope document specifying what components will be tested,
      excluded items, testing depth, and success criteria. Use clear bullet points
      for each scope element.
  execute_test_cases:
    agent: false
    description: Carry out automated/manual test execution
    name: execute_test_cases
    nodes_depended_on:
    - create_test_cases
    - prepare_test_environment
    nodes_dependent_on:
    - log_execution_results
    prompt: Execute each test case from the test case document in the prepared environment.
      Record basic test status (pass/fail) for each test case.
  gather_test_requirements:
    agent: false
    description: Collect and document testing requirements from stakeholders
    name: gather_test_requirements
    nodes_depended_on: []
    nodes_dependent_on:
    - define_test_scope
    prompt: Generate a detailed list of testing requirements based on stakeholder
      expectations, including functional and non-functional criteria. Format as bullet
      points with one-line descriptions for each requirement.
  generate_test_report:
    agent: false
    description: Produce final test summary and defect analysis
    name: generate_test_report
    nodes_depended_on:
    - validate_test_results
    - create_test_cases
    nodes_dependent_on: []
    prompt: Generate a comprehensive test report with pass/fail statistics, defect
      classifications, root cause analysis, and recommendations for remediation.
  log_execution_results:
    agent: false
    description: Capture raw test output and system behaviors
    name: log_execution_results
    nodes_depended_on:
    - execute_test_cases
    nodes_dependent_on:
    - validate_test_results
    prompt: Systematically record detailed execution logs including screenshots, error
      messages, response times, and system state changes for each test case.
  prepare_test_environment:
    agent: false
    description: Configure hardware, software, and test data infrastructure
    name: prepare_test_environment
    nodes_depended_on:
    - define_test_scope
    nodes_dependent_on:
    - execute_test_cases
    - clean_up_test_environment
    prompt: Create a test environment blueprint specifying software versions, hardware
      configurations, network parameters, and data sets to be used during testing.
  validate_test_results:
    agent: false
    description: Analyze outcomes against expectations
    name: validate_test_results
    nodes_depended_on:
    - log_execution_results
    nodes_dependent_on:
    - generate_test_report
    prompt: Compare test execution logs against the expected outcomes in the test
      case document. Note discrepancies, performance metrics, and error patterns.
