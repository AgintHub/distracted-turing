dag_type: spec
description: Generated workflow from UI.
name: execute_test_workflow
nodes:
  analyze_test_results:
    agent: false
    description: Performs an objective, rule‑based assessment of test outcomes, comparing
      actual results to expected criteria and aggregating pass/fail metrics without
      providing remediation guidance.
    name: analyze_test_results
    nodes_depended_on:
    - collect_test_results
    nodes_dependent_on: []
    output_structure:
    - description: Brief textual summary of the analysis highlighting overall findings.
      key: summary
      type: str
    - description: Total number of test cases evaluated.
      key: total_tests
      type: int
    - description: Count of test cases that met expected outcomes.
      key: passed_tests
      type: int
    - description: Count of test cases that did not meet expected outcomes.
      key: failed_tests
      type: int
    - description: Identifiers or names of the test cases that failed.
      key: failed_test_ids
      type: List[str]
    - description: Overall pass/fail status of the test run (true if all tests passed).
      key: overall_pass
      type: bool
    prd:
      conceptual_info: The analyze_test_results node ingests raw execution data from
        collect_test_results, interprets expected versus actual outcomes per test
        case, and compiles a concise, deterministic report. It is deliberately devoid
        of any recommendation or remedial content, ensuring that downstream nodes
        receive a clean pass/fail verdict for further processing or reporting.
      docstring:
        examples:
        - lines:
          - result = analyze_test_results(execution_logs, error_messages, performance_metrics)
          - print(result['overall_pass'])
          output: 'True'
        parameters:
        - description: Raw log entries for each test case, including embedded expected
            outcome metadata.
          name: execution_logs
          type: List[str]
        - description: Exception traces or failure notes captured during execution.
          name: error_messages
          type: List[str]
        - description: Numeric performance measurements such as response time and
            memory usage.
          name: performance_metrics
          type: List[float]
        raises:
        - description: Raised if input lists are of unequal length or contain malformed
            entries.
          type: ValueError
        returns:
          description: A JSON‑serializable dictionary containing summary, counts,
            failed identifiers, and overall pass flag.
          type: dict
        summary: Determines pass/fail status for each test case and aggregates overall
          test suite metrics.
    prompt: "You are tasked with performing a rigorous, objective analysis of the\
      \ test execution data supplied by the **collect_test_results** node. The input\
      \ will consist of three parallel lists:\n\n1. **execution_logs** – raw log entries\
      \ per test case.\n2. **error_messages** – any exception traces or failure notes.\n\
      3. **performance_metrics** – numeric values such as response time and memory\
      \ usage.\n\nYour objective is to:\n\n1. **Parse** each test case's expected\
      \ outcome embedded in the log metadata.\n2. **Determine** the actual outcome:\
      \ *Passed* if the actual result matches the expected, *Failed* otherwise.\n\
      3. **Aggregate** the results to produce:\n   - A concise textual *summary* highlighting\
      \ overall pass rate and notable anomalies.\n   - Counts of total, passed, and\
      \ failed test cases.\n   - A list of identifiers (or names) for any failed test\
      \ cases.\n   - An overall boolean flag indicating whether the entire suite passed.\n\
      \n**Constraints & Requirements**\n- Do not generate any remediation or recommendation\
      \ text.\n- All outputs must be deterministic and reproducible.\n- Preserve the\
      \ output structure exactly as specified below.\n\n**Output Format** (JSON):\n\
      ```json\n{\n  \"summary\": \"<text>\",\n  \"total_tests\": <int>,\n  \"passed_tests\"\
      : <int>,\n  \"failed_tests\": <int>,\n  \"failed_test_ids\": [\"<id>\", ...],\n\
      \  \"overall_pass\": <bool>\n}\n```\nEnsure that the JSON keys match the names\
      \ exactly and that data types align with the defined primitives.\n\n*Example*:\
      \ If 100 tests are run, 92 pass, 8 fail with IDs `TC-001`, `TC-003`, …, the\
      \ output would be:\n```json\n{\n  \"summary\": \"Out of 100 tests, 92 passed\
      \ and 8 failed. 8 failures observed.\",\n  \"total_tests\": 100,\n  \"passed_tests\"\
      : 92,\n  \"failed_tests\": 8,\n  \"failed_test_ids\": [\"TC-001\", \"TC-003\"\
      , ...],\n  \"overall_pass\": false\n}\n```\n"
  collect_test_results:
    agent: false
    description: Aggregates raw execution logs, error traces, and performance metrics
      from a test run, categorizes and aggregates the data, and provides a concise
      summary for quick insight.
    name: collect_test_results
    nodes_depended_on:
    - execute_test_teardown
    nodes_dependent_on: []
    output_structure:
    - description: List of raw execution log entries captured during the test run
      key: execution_logs
      type: List[str]
    - description: List of error messages or exception traces generated during execution
      key: error_messages
      type: List[str]
    - description: Numeric performance measurements (e.g., response times, memory
        usage) recorded for the test run
      key: performance_metrics
      type: List[float]
    - description: Brief textual summary of the collected logs and errors
      key: log_summary
      type: str
    prd:
      conceptual_info: The collect_test_results node functions as the central intelligence
        layer of the testing pipeline, transforming low‑level execution artefacts
        into a coherent, actionable knowledge base. By systematically normalising
        logs, classifying failures, and summarising performance, it enables downstream
        reporting, root‑cause analysis, and continuous improvement initiatives.
      docstring:
        examples:
        - lines:
          - from collect_test_results import collect_test_results
          - result = collect_test_results(test_output)
          - print(result['log_summary'])
          output: '"3 errors encountered: 2 AssertionErrors, 1 TimeoutError. Average
            response time 120.4ms exceeded the 100ms threshold."'
        parameters:
        - description: Dictionary containing raw logs, error traces, and metric snapshots
            produced by the test harness.
          name: test_output
          type: dict
        raises:
        - description: Raised if the input dictionary lacks required keys or contains
            malformed data.
          type: ValueError
        returns:
          description: A dictionary with keys 'execution_logs', 'error_messages',
            'performance_metrics', and 'log_summary' as described in the output structure.
          type: dict
        summary: Aggregates and normalises test execution artifacts into a structured
          report.
    prompt: 'Collect, normalize, and synthesize all artifacts produced by the test
      run:


      1. **Raw Execution Logs** – Capture every line of stdout/stderr and any external
      logs emitted during scenario execution. Store each entry as a string, preserving
      timestamps and source identifiers.

      2. **Error and Exception Traces** – Extract every exception stack trace, warning,
      or error message. Classify each by severity (INFO, WARNING, ERROR, CRITICAL)
      and by category (AssertionError, TimeoutError, ResourceError, etc.). Return
      a list of formatted strings that include the classification.

      3. **Performance Metrics** – Gather numeric metrics recorded by the test harness
      (e.g., response time, memory usage, CPU utilization, throughput). If multiple
      runs of a scenario exist, aggregate them by computing mean, median, min, max,
      and standard deviation. Store each metric as a float.

      4. **Summary Report** – Produce a concise natural‑language paragraph that highlights
      the total number of errors, the most frequent failure types, and any performance
      thresholds that were exceeded. The summary should be no longer than three sentences
      and written for a senior engineering manager.


      The node must return a structured payload matching the output structure defined
      below. No intermediate files or side effects should be produced; all data must
      be returned in memory.'
  create_test_cases:
    agent: false
    description: Generates a comprehensive, structured list of baseball-themed test
      cases derived from the defined test scope, ensuring coverage of all objectives,
      constraints, and success criteria. These test cases are designed to simulate
      real-world baseball scenarios, allowing for thorough testing of the system's
      functionality and performance.
    name: create_test_cases
    nodes_depended_on:
    - identify_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: List of test case descriptions, each containing steps, input data
        requirements, and expected outcomes, formatted as numbered items.
      key: test_cases
      type: List[str]
    - description: The total number of test cases generated.
      key: total_cases
      type: int
    prd:
      conceptual_info: This node translates high-level test goals and constraints
        into actionable, traceable baseball-themed test cases that can be directly
        executed by QA teams or automated frameworks. It ensures that every requirement
        is validated, reduces ambiguity, and provides a clear audit trail from scope
        to execution.
      docstring:
        examples:
        - lines:
          - test_scope = {
          - '    ''goals'': [''Test pitching functionality''],'
          - '    ''boundaries'': [''In-scope: pitching; Out-of-scope: batting''],'
          - '    ''success_criteria'': [''Pitching functionality works as expected''],'
          - '    ''summary'': ''Test pitching functionality.'''
          - '}'
          - test_cases = create_test_cases(test_scope)
          - print(test_cases)
          output: '{''test_cases'': [''Test case 1: Pitching functionality'', ''Test
            case 2: Pitching functionality with errors''], ''total_cases'': 2}'
        parameters:
        - description: A dictionary containing the test scope definition, including
            goals, boundaries, success criteria, and summary.
          name: test_scope
          type: dict
        raises: []
        returns:
          description: A dictionary containing the list of baseball-themed test cases
            and the total number of test cases generated.
          type: dict
        summary: Generate a list of baseball-themed test cases based on the provided
          test scope definition.
    prompt: Create a list of baseball-themed test cases based on the provided test
      scope definition. The test cases should cover various baseball-related scenarios,
      such as pitching, batting, and fielding. Ensure that each test case includes
      steps, input data requirements, and expected outcomes, formatted as numbered
      items. The test cases should be structured to allow for easy execution and validation
      by QA teams or automated frameworks.
  execute_test_setup:
    agent: false
    description: Initialize the test execution environment by setting up required
      configurations, loading test data, and initializing test states to ensure a
      stable test environment.
    name: execute_test_setup
    nodes_depended_on:
    - generate_test_data
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier of the prepared test execution environment.
      key: environment_id
      type: str
    - description: Ordered list of configuration actions performed during setup (e.g.,
        "install dependencies", "configure network", "initialize services").
      key: setup_steps
      type: List[str]
    - description: Identifiers or file names of test data assets that were loaded
        into the environment.
      key: loaded_test_data
      type: List[str]
    - description: Flag indicating whether the environment is fully configured and
        ready for test execution.
      key: environment_ready
      type: bool
    prd:
      conceptual_info: This node ensures that the test environment is properly set
        up and configured before test execution, guaranteeing reliable and consistent
        test results.
      docstring:
        examples:
        - lines:
          - test_data = ['test_data_1.csv', 'test_data_2.json']
          - setup_result = execute_test_setup(test_data)
          output: '{''environment_id'': ''env-123'', ''setup_steps'': [''install dependencies'',
            ''configure network''], ''loaded_test_data'': [''test_data_1.csv'', ''test_data_2.json''],
            ''environment_ready'': True}'
        parameters:
        - description: List of test data files generated by the 'generate_test_data'
            node.
          name: test_data
          type: List[str]
        raises:
        - description: Raised if the test environment cannot be properly set up or
            configured.
          type: Exception
        returns:
          description: A dictionary containing the environment ID, setup steps, loaded
            test data, and environment readiness flag.
          type: dict
        summary: Sets up the test execution environment by loading test data and initializing
          test states.
    prompt: Perform comprehensive pre-test configuration by loading test data generated
      from the 'generate_test_data' node, initializing required test states, and executing
      all necessary setup steps to ensure a stable test environment. Validate the
      environment's readiness, prepare it for test execution, and record the environment
      ID, ordered setup steps, loaded test data assets, and readiness flag.
  execute_test_teardown:
    agent: false
    description: Orchestrates a comprehensive and meticulous rollback of the test
      environment, ensuring the removal of all artifacts and the restoration of configurations
      altered during test execution to guarantee isolation, repeatability, and data
      integrity.
    name: execute_test_teardown
    nodes_depended_on:
    - run_test_scenarios
    nodes_dependent_on: []
    output_structure:
    - description: Indicates whether the environment cleanup completed without errors.
      key: cleanup_success
      type: bool
    - description: List of filenames, directories, or resources that were deleted
        during teardown.
      key: removed_artifacts
      type: List[str]
    - description: Any error messages encountered while attempting to remove artifacts
        or reset configurations.
      key: error_messages
      type: List[str]
    prd:
      conceptual_info: The execute_test_teardown node serves as the final gatekeeper
        of the test lifecycle, ensuring that every side-effect produced by the run_test_scenarios
        node is fully neutralized and the environment is restored to a known good
        state. This guarantees that each test run is isolated, repeatable, and free
        from residual state that could skew results or degrade system performance.
      docstring:
        examples:
        - lines:
          - 'test_environment_state = {''files'': [''temp_file1.txt'', ''temp_file2.txt''],
            ''directories'': [''temp_dir1'', ''temp_dir2'']}'
          - teardown_result = execute_test_teardown(test_environment_state)
          - print(teardown_result)
          output: '{"cleanup_success": true, "removed_artifacts": ["temp_file1.txt",
            "temp_file2.txt", "temp_dir1", "temp_dir2"], "error_messages": []}'
        parameters:
        - description: The current state of the test environment, including any modifications
            made during test execution.
          name: test_environment_state
          type: dict
        raises:
        - description: If the teardown operation fails due to an unexpected error
            or exception.
          type: RuntimeError
        returns:
          description: A structured summary of the teardown operation, including success
            status, removed artifacts, and any error messages.
          type: dict
        summary: Restores the test environment to its original state after all test
          scenarios have executed, ensuring data integrity and repeatability.
    prompt: 'After all test scenarios have executed, thoroughly restore the testing
      environment to its pristine pre-test state by executing the following steps:

      1. Identify and enumerate every temporary file, directory, database entry, environment
      variable, and network service introduced or altered during the test run.

      2. Safely delete or revert each artifact, ensuring no residual data remains
      that could bias subsequent executions or compromise data integrity.

      3. Verify that all system configurations, such as registry keys, kernel parameters,
      or container images, have been reset to their original defaults or predefined
      baselines.

      4. Record the outcome of each cleanup action, capturing any failures, warnings,
      or unexpected behaviors.

      5. Return a structured summary of the teardown operation, including a success
      status indicator, a list of removed items, and any error messages or diagnostic
      information.

      Ensure all actions are performed in a deterministic manner, with precise, ISO
      8601-formatted timestamps for each significant event.'
  generate_test_data:
    agent: false
    description: Synthesizes, validates, and delivers comprehensive, schema-compliant
      test data files for all test cases, ensuring fidelity, volume compliance, and
      environmental readiness before test execution, leveraging seeded random generators
      for deterministic and reproducible results.
    name: generate_test_data
    nodes_depended_on:
    - create_test_cases
    - prepare_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: List of filenames or identifiers for the generated test data sets.
      key: test_data_files
      type: List[str]
    - description: Corresponding number of records in each generated test data file.
      key: record_counts
      type: List[int]
    - description: File format or schema type for each generated test data file (e.g.,
        CSV, JSON).
      key: data_formats
      type: List[str]
    - description: Indicates whether all generated data meet the required specifications
        and are ready for use.
      key: is_valid
      type: bool
    prd:
      conceptual_info: The generate_test_data node acts as the linchpin that bridges
        test design and execution by producing every data artifact that test cases
        will consume, ensuring each file adheres to the declared schema, respects
        data distribution constraints, and is compatible with the pre-configured testing
        environment.
      docstring:
        examples:
        - lines:
          - test_cases = ['test_case_1', 'test_case_2']
          - 'environment_config = {''setup_steps'': [''step1'', ''step2''], ''installed_software'':
            [''software1'', ''software2'']}'
          - generate_test_data(test_cases, environment_config)
          output: '{''test_data_files'': [''test_data_file1.csv'', ''test_data_file2.json''],
            ''record_counts'': [1000, 500], ''data_formats'': [''CSV'', ''JSON''],
            ''is_valid'': [True, True]}'
        parameters:
        - description: List of test case descriptions, each containing steps, input
            data requirements, and expected outcomes.
          name: test_cases
          type: List[str]
        - description: Environment configuration details, including setup steps, installed
            software, hardware configuration, validation steps, and validation results.
          name: environment_config
          type: dict
        raises:
        - description: If any test case cannot be satisfied due to conflicting constraints
            or missing environment resources, an informative exception is raised.
          type: Exception
        returns:
          description: A dictionary containing the generated test data files, record
            counts, data formats, and validity flags.
          type: dict
        summary: Generates and validates synthetic or curated test data files for
          all defined test cases, ensuring schema fidelity, volume compliance, and
          environmental readiness.
    prompt: 'Given the list of test cases produced by **create_test_cases** and the
      environment configuration from **prepare_test_environment**, generate and validate
      all required test data files, producing a JSON object with the following fields:
      test_data_files (List[str]), record_counts (List[int]), data_formats (List[str]),
      and is_valid (List[bool]). Ensure schema fidelity, volume compliance, and environmental
      readiness. Utilize seeded random generators to guarantee deterministic results.'
  generate_test_report:
    agent: false
    description: Transforms the aggregated metrics from analyze_test_results into
      a stakeholder‑ready, objective test evaluation report, summarizing scope, procedures,
      quantitative outcomes, and a deterministic pass/fail verdict.
    name: generate_test_report
    nodes_depended_on:
    - analyze_test_results
    nodes_dependent_on: []
    output_structure:
    - description: Brief description of the test scope and objectives
      key: test_scope
      type: str
    - description: List of high‑level test procedures or steps that were executed
      key: test_procedures
      type: List[str]
    - description: Objective analysis of the test results, highlighting any deviations
      key: results_analysis
      type: str
    - description: Final pass/fail status of the test suite (true = pass, false =
        fail)
      key: overall_status
      type: bool
    prd:
      conceptual_info: The generate_test_report node is the final reporting stage
        of the testing workflow. It condenses raw aggregation data from analyze_test_results
        into a human‑readable, executive‑friendly JSON report that conveys the scope
        of testing, the methods employed, factual outcomes, and a deterministic pass/fail
        flag. By separating analysis from narration, it ensures that downstream quality
        gates receive a clean boolean decision while executives receive an intelligible
        summary without remediation bias.
      docstring:
        examples:
        - lines:
          - 'analysis_json = {"summary": "All tests executed.", "total_tests": 120,
            "passed_tests": 118, "failed_tests": 2, "failed_test_ids": ["test_user_create_missing_field",
            "test_auth_token_expiry"], "overall_pass": false}'
          - report = generate_test_report(analysis_json)
          - print(report)
          output: '{"test_scope": "Functional regression of API v2 endpoints for the
            user management module", "test_procedures": ["Unit test suite for user
            CRUD operations", "Load testing of authentication endpoint"], "results_analysis":
            "120 tests executed: 118 passed, 2 failed (missing field and token expiry).
            All failures were in edge‑case scenarios; no core functionality regressions
            detected.", "overall_status": false}'
        parameters:
        - description: Dictionary containing the output from analyze_test_results,
            including total_tests, passed_tests, failed_tests, failed_test_ids, and
            overall_pass.
          name: analysis_json
          type: dict
        raises:
        - description: Raised if the input dictionary is missing required keys or
            has mismatched types.
          type: ValueError
        returns:
          description: JSON object with keys test_scope, test_procedures, results_analysis,
            and overall_status.
          type: dict
        summary: Generate an objective test evaluation summary from aggregated test
          metrics.
    prompt: "You will receive the JSON result from the **analyze_test_results** node.\
      \ Produce a concise, objective test report JSON object that contains exactly\
      \ the following fields:\n\n1. **test_scope** (string): A single‑sentence description\
      \ of what the test suite was intended to validate (e.g., \"Functional regression\
      \ of API v2 endpoints for the user management module\").\n2. **test_procedures**\
      \ (List[str]): A list of the high‑level test procedures or categories that were\
      \ executed (e.g., \"Unit test suite for user CRUD operations\", \"Load testing\
      \ of authentication endpoint\").\n3. **results_analysis** (string): An objective\
      \ textual summary that states total tests executed, number passed, number failed,\
      \ and a brief mention of the nature of failures (e.g., edge‑case, performance).\
      \ Avoid subjective language or recommendations.\n4. **overall_status** (bool):\
      \ A Boolean flag that is true only if *all* tests passed.\n\nThe output must\
      \ be *exactly* these keys with the specified types and no additional keys or\
      \ narrative outside the JSON. Follow the format shown in the example.\n\n**Example**:\n\
      Input from analyze_test_results:\n```json\n{\n  \"summary\": \"All tests executed.\"\
      ,\n  \"total_tests\": 120,\n  \"passed_tests\": 118,\n  \"failed_tests\": 2,\n\
      \  \"failed_test_ids\": [\"test_user_create_missing_field\", \"test_auth_token_expiry\"\
      ],\n  \"overall_pass\": false\n}\n```\nOutput:\n```json\n{\n  \"test_scope\"\
      : \"Functional regression of API v2 endpoints for the user management module\"\
      ,\n  \"test_procedures\": [\"Unit test suite for user CRUD operations\", \"\
      Load testing of authentication endpoint\"],\n  \"results_analysis\": \"120 tests\
      \ executed: 118 passed, 2 failed (missing field and token expiry). All failures\
      \ were in edge‑case scenarios; no core functionality regressions detected.\"\
      ,\n  \"overall_status\": false\n}\n```"
  identify_test_scope:
    agent: false
    description: Defines the strategic framework for a test run by specifying explicit
      goals, scope boundaries, measurable success criteria, and a concise summary
      that guides test case creation, environment setup, and execution planning, ensuring
      alignment with business objectives, regulatory requirements, and product roadmap
      milestones.
    name: identify_test_scope
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: List of specific test goals to be achieved
      key: goals
      type: List[str]
    - description: List of limits and constraints defining what is in‑scope and out‑of‑scope
        for the test
      key: boundaries
      type: List[str]
    - description: List of measurable criteria that determine when the test is considered
        successful
      key: success_criteria
      type: List[str]
    - description: Brief textual summary of the overall test scope
      key: summary
      type: str
    prd:
      conceptual_info: The identify_test_scope node establishes the strategic vision
        for a test cycle, capturing the intent, constraints, and acceptance metrics
        that direct subsequent test design, environment provisioning, and execution
        planning. This node ensures alignment with business objectives, regulatory
        requirements, and product roadmap milestones.
      docstring:
        examples:
        - lines:
          - test_scope = identify_test_scope(test_cycle_input='Product X, Platform
            Y, Regulatory Z')
          output: '{"goals": ["Ensure all new API endpoints meet latency targets"],
            "boundaries": ["In-scope: v1.3 APIs; Out-of-scope: legacy v1.1 APIs"],
            "success_criteria": ["Latency < 200 ms for 95% of requests"], "summary":
            "Test focuses on v1.3 API performance and reliability, excluding legacy
            components."}'
        parameters:
        - description: Input string containing test cycle information, such as product
            version, platform, and regulatory requirements
          name: test_cycle_input
          type: str
        raises:
        - description: Raised when the input string is empty or invalid
          type: ValueError
        returns:
          description: A JSON object containing the defined test scope, including
            goals, boundaries, success criteria, and summary
          type: dict
        summary: Defines the test scope, including goals, boundaries, success criteria,
          and summary, to guide test case creation and environment setup.
    prompt: 'You are tasked with defining a comprehensive test scope for the upcoming
      test cycle. Deliver a clear, structured definition that includes:

      1. A prioritized list of **specific test goals** that align with business objectives,
      regulatory requirements, and product roadmap milestones.

      2. A **boundaries** section that explicitly lists what is **in-scope** and what
      is **out-of-scope**, including constraints such as data volume limits, platform
      versions, third-party integration boundaries, and environmental considerations.

      3. A set of **measurable success criteria** expressed as quantitative or qualitative
      thresholds (e.g., defect density < 0.5%, performance latency < 200 ms, compliance
      pass rate ≥ 99%, customer satisfaction rating ≥ 4.5/5).

      4. A one-paragraph **summary** that captures the overall intent, critical constraints,
      and expected impact of the defined scope, including key performance indicators
      (KPIs), metrics, and data-driven insights.


      The output should be a JSON object with the following keys: ''goals'', ''boundaries'',
      ''success_criteria'', and ''summary''. Each key should map to a list or string
      as specified in the output structure.'
  prepare_test_environment:
    agent: false
    description: Automates the end‑to‑end provisioning, configuration, isolation,
      and validation of a test environment that strictly adheres to the test scope
      defined by the parent node, guaranteeing repeatability, compliance, and readiness
      for test execution.
    name: prepare_test_environment
    nodes_depended_on:
    - identify_test_scope
    nodes_dependent_on: []
    output_structure:
    - description: Ordered list of actions performed to configure the testing environment
      key: setup_steps
      type: List[str]
    - description: Names and versions of software components installed in the environment
      key: installed_software
      type: List[str]
    - description: Details of hardware resources allocated or configured for testing
      key: hardware_configuration
      type: List[str]
    - description: Outcome of each validation step (true if successful, false otherwise)
        in the same order as validation_steps
      key: validation_results
      type: List[bool]
    - description: Descriptions of the validation checks performed to verify the environment
        setup
      key: validation_steps
      type: List[str]
    - description: Concise summary of the prepared testing environment and its readiness
        status
      key: environment_summary
      type: str
    prd:
      conceptual_info: The prepare_test_environment node is the gatekeeper that guarantees
        a consistent, reliable, and compliant test environment before any test data
        or cases are introduced. It abstracts the complexities of infrastructure provisioning
        into a single, repeatable step, thereby reducing manual errors, speeding up
        test cycles, and enabling continuous integration pipelines to run smoothly.
      docstring:
        examples:
        - lines:
          - 'test_scope = {"goals": [...], "boundaries": [...], "success_criteria":
            [...], "summary": "..."}'
          - result = prepare_test_environment(test_scope)
          output: '{"setup_steps": [...], "installed_software": [...], "hardware_configuration":
            [...], "validation_steps": [...], "validation_results": [...], "environment_summary":
            "Ready."}'
        parameters:
        - description: Structured test scope JSON output from identify_test_scope,
            containing goals, boundaries, success_criteria, and summary.
          name: test_scope
          type: dict
        raises:
        - description: Raised when hardware or software provisioning fails after exhaustive
            retries.
          type: ProvisioningError
        - description: Raised when one or more validation steps fail after attempted
            remediation.
          type: ValidationError
        returns:
          description: JSON object containing setup_steps, installed_software, hardware_configuration,
            validation_steps, validation_results, and environment_summary.
          type: dict
        summary: Provision, configure, isolate, and validate the testing environment
          based on the test scope.
    prompt: 'Using the JSON object output from **identify_test_scope** (which contains
      the keys `goals`, `boundaries`, `success_criteria`, and `summary`), orchestrate
      a fully automated, reproducible test environment. The orchestration must:


      1. **Hardware Provisioning** – Allocate the exact compute, storage, and networking
      resources specified in the test scope (e.g., VM types, GPU count, high‑speed
      SSDs, network bandwidth). Capture and persist resource identifiers for audit
      and rollback.

      2. **Software Stack Installation** – Install the precise versions of operating
      system packages, runtime environments, databases, message queues, and any vendor‑specific
      tools mandated by the scope. Record each component’s name and version.

      3. **Configuration Management** – Apply system‑level settings (kernel parameters,
      security policies), application configuration files, and network routing rules.
      Ensure every change is idempotent and can be re‑applied without drift.

      4. **Environment Isolation** – Provision container orchestration (Docker/Kubernetes)
      or virtualized sandboxes to guarantee repeatability across runs and to enforce
      network segmentation.

      5. **Validation Suite** – Execute a predefined set of health‑check scripts (e.g.,
      `healthcheck.sh`, `db_connectivity_test.py`) and log pass/fail outcomes. Each
      check should be repeatable and produce deterministic results.

      6. **Documentation** – Generate a concise summary that lists all provisioning
      steps, installed components, validation results, and any rollback actions taken.


      The output must be a JSON object with the following keys and ordering:

      - `setup_steps` (List[str]) – Ordered list of actions performed.

      - `installed_software` (List[str]) – Names and versions of installed components.

      - `hardware_configuration` (List[str]) – Details of allocated hardware resources.

      - `validation_steps` (List[str]) – Descriptions of validation checks.

      - `validation_results` (List[bool]) – Boolean result of each validation step.

      - `environment_summary` (str) – Concise summary of the prepared environment
      and its readiness status.


      Ensure all intermediate data is logged, the process is idempotent, and any failures
      trigger an automated rollback to a clean state before reporting results.'
  run_test_scenarios:
    agent: false
    description: Orchestrates the deterministic execution of a full test suite, aggregating
      low‑level artifacts such as raw logs, pass/fail status, and precise timing metrics
      for downstream analytics.
    name: run_test_scenarios
    nodes_depended_on:
    - execute_test_setup
    nodes_dependent_on: []
    output_structure:
    - description: Identifiers of the test cases that were executed
      key: test_case_ids
      type: List[str]
    - description: Pass/fail status for each test case; true indicates pass, false
        indicates fail
      key: execution_status
      type: List[bool]
    - description: Raw log output captured for each test case execution
      key: execution_logs
      type: List[str]
    - description: Duration of each test case execution in seconds
      key: execution_times_seconds
      type: List[float]
    prd:
      conceptual_info: The run_test_scenarios node is the core execution engine that
        transforms a prepared test environment into a reproducible record of test
        performance and outcomes. It captures granular execution artifacts that enable
        downstream reporting, regression analysis, and performance trend monitoring.
      docstring:
        examples:
        - lines:
          - results = run_test_scenarios(
          - '    environment_id=''env-123'','
          - '    test_case_ids=[''tc1'', ''tc2'', ''tc3''],'
          - '    timeout_seconds=120.0)'
          - print(results['execution_status'])
          output: '[True, False, True]'
        parameters:
        - description: Unique identifier of the prepared test environment returned
            by execute_test_setup.
          name: environment_id
          type: str
        - description: Ordered list of test case identifiers to run.
          name: test_case_ids
          type: List[str]
        - description: Maximum allowed wall‑clock time for any single test case before
            it is forcefully terminated.
          name: timeout_seconds
          type: float
        raises:
        - description: Raised if the environment_id is missing or the test harness
            invocation fails to start.
          type: RuntimeError
        - description: Raised if test_case_ids is empty or contains duplicates.
          type: ValueError
        returns:
          description: 'Dictionary containing four lists: test_case_ids, execution_status,
            execution_logs, execution_times_seconds, all of equal length.'
          type: dict
        summary: Execute a list of test cases within a pre‑configured environment
          and return deterministic, machine‑readable execution metadata.
    prompt: "You are to execute every test case defined in the current test suite\
      \ using the environment prepared by the preceding node. The node must:\n\n1.\
      \ Iterate over the ordered list of test case identifiers supplied by the caller.\n\
      2. For each test case:\n   - Launch the test harness via the CLI or API endpoint,\
      \ passing the `environment_id` and any test‑specific payload.\n   - Record the\
      \ exact ISO‑8601 UTC timestamps (`start_time`, `end_time`).\n   - Capture raw\
      \ `stdout` and `stderr` streams as a single UTF‑8 string.\n   - Record the numeric\
      \ exit code; any non‑zero exit code or assertion exception is a failure.\n \
      \  - Compute the wall‑clock duration in seconds (`duration_seconds`).\n   -\
      \ If the execution exceeds the configurable `timeout_seconds`, terminate the\
      \ process, log a clear timeout message, and mark the test as failed.\n3. Append\
      \ the results in the order processed to a cumulative list.\n4. Return a single\
      \ machine‑readable JSON object containing four arrays of equal length:\n   -\
      \ `test_case_ids` (List[str])\n   - `execution_status` (List[bool])\n   - `execution_logs`\
      \ (List[str])\n   - `execution_times_seconds` (List[float])\n\nAll logs must\
      \ be unmodified raw output; no summarisation or filtering is permitted. The\
      \ function must be deterministic: identical input sequences must always produce\
      \ identical JSON output."
