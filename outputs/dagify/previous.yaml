dag_type: plain_text
description: A parallelized, atomic workflow for creating a song about birds, with
  decoupled composition of lyrics, melody, harmony, and structural elements
name: write_song_about_birds
nodes:
  add_harmonies:
    agent: false
    description: Implement vocal/instrumental harmonic arrangements
    name: add_harmonies
    nodes_depended_on:
    - finalize_lyrics
    - create_harmonies
    nodes_dependent_on:
    - review_and_revise
    prompt: Apply harmonic layers to vocal lines and instrumental tracks based on
      established chord structure
  add_instrumentation:
    agent: false
    description: Select and sequence accompaniment instruments
    name: add_instrumentation
    nodes_depended_on:
    - arrange_sections
    nodes_dependent_on:
    - write_bridge
    - finalize_lyrics
    prompt: Specify instrumentation (guitar, piano, etc.) and rhythmic patterns that
      enhance bird motifs
  arrange_sections:
    agent: false
    description: Sequence and develop section instrumentation
    name: arrange_sections
    nodes_depended_on:
    - decide_song_structure
    - create_chord_progression
    nodes_dependent_on:
    - add_instrumentation
    prompt: Plan dynamic shifts, instrumental entry points, and phrase repetition
      for each structural element
  brainstorm_bird_themes:
    agent: false
    description: Generate thematic foundations for lyrical content
    name: brainstorm_bird_themes
    nodes_depended_on: []
    nodes_dependent_on:
    - create_verse_lyrics
    - create_chorus_lyrics
    prompt: List 5-8 bird-related themes (e.g., flight, migration, symbolism) with
      brief emotional associations for each
  choose_key_and_tempo:
    agent: false
    description: Determine tonal foundation and rhythmic framework
    name: choose_key_and_tempo
    nodes_depended_on: []
    nodes_dependent_on:
    - compose_main_melody
    - create_chord_progression
    prompt: Specify a musical key and tempo (BPM) that evokes avian qualities (lightness,
      freedom, etc.)
  compose_main_melody:
    agent: false
    description: Develop primary melodic motif
    name: compose_main_melody
    nodes_depended_on:
    - choose_key_and_tempo
    nodes_dependent_on:
    - decide_song_structure
    - create_harmonies
    prompt: Compose a melodic line in the specified key that reflects avian qualities
      (light, flowing motion)
  create_chord_progression:
    agent: false
    description: Establish harmonic foundation
    name: create_chord_progression
    nodes_depended_on:
    - choose_key_and_tempo
    nodes_dependent_on:
    - arrange_sections
    prompt: Design a chord progression in the selected key that supports lyrical themes
      and melodic contour
  create_chorus_lyrics:
    agent: false
    description: Write central repeating lyrical motif
    name: create_chorus_lyrics
    nodes_depended_on:
    - brainstorm_bird_themes
    nodes_dependent_on:
    - decide_song_structure
    - compose_main_melody
    prompt: Develop a memorable chorus emphasizing the most powerful bird-related
      themes
  create_harmonies:
    agent: false
    description: Develop vocal/instrumental harmonic support
    name: create_harmonies
    nodes_depended_on:
    - compose_main_melody
    - create_chorus_lyrics
    nodes_dependent_on:
    - arrange_sections
    prompt: Design harmonic layers that complement the main melody and lyrical focus
  create_verse_lyrics:
    agent: false
    description: Write narrative verses based on bird themes
    name: create_verse_lyrics
    nodes_depended_on:
    - brainstorm_bird_themes
    nodes_dependent_on:
    - decide_song_structure
    prompt: Compose 2-3 verses using concrete bird imagery and thematic elements from
      the brainstorm
  decide_song_structure:
    agent: false
    description: Define pattern of sections (verse, chorus, bridge, etc.)
    name: decide_song_structure
    nodes_depended_on:
    - create_verse_lyrics
    - create_chorus_lyrics
    - compose_main_melody
    nodes_dependent_on:
    - arrange_sections
    prompt: Map out a 3-4 minute song structure using existing lyrical components
      and melodic phrases
  finalize_lyrics:
    agent: false
    description: Polish and synchronize all lyrical elements
    name: finalize_lyrics
    nodes_depended_on:
    - create_verse_lyrics
    - create_chorus_lyrics
    - write_bridge
    nodes_dependent_on:
    - add_instrumentation
    - add_harmonies
    prompt: Refine rhyme schemes, syllabic flow, and thematic consistency across all
      lyrical sections
  produce_song:
    agent: false
    description: Prepare final song recording
    name: produce_song
    nodes_depended_on:
    - review_and_revise
    nodes_dependent_on: []
    prompt: Compile all elements into a polished production with appropriate FX and
      mixing
  review_and_revise:
    agent: false
    description: Evaluate and optimize song elements
    name: review_and_revise
    nodes_depended_on:
    - add_instrumentation
    - add_harmonies
    - finalize_lyrics
    nodes_dependent_on:
    - produce_song
    prompt: Critique lyrical-melodic coherence, dynamic contrast, and thematic impact,
      noting specific revisions
  write_bridge:
    agent: false
    description: Create contrasting transitional section
    name: write_bridge
    nodes_depended_on:
    - brainstorm_bird_themes
    - decide_song_structure
    nodes_dependent_on:
    - finalize_lyrics
    prompt: Compose a bridge that introduces new thematic or melodic elements related
      to bird imagery
