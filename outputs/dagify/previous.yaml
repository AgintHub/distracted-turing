dag_type: plain_text
description: Create a detailed screenplay for a movie where Tony Soprano lives and
  becomes a hairdresser, structuring the narrative with character development and
  comedic gangster-haircare crossover elements.
name: sopranos_hairdresser_screenplay
nodes:
  create_character_profiles:
    agent: false
    description: Define key character traits and roles in the new setting
    name: create_character_profiles
    nodes_depended_on: []
    nodes_dependent_on:
    - write_dialogue_tony
    - write_dialogue_clients
    - establish_tony_backstory
    prompt: Develop detailed character profiles for Tony as a hairdresser, his criminal
      colleagues working secretly in the salon, and rival hairstylist characters.
      Include 2-3 unique traits per character.
  create_end_titles:
    agent: false
    description: Craft closing credits
    name: create_end_titles
    nodes_depended_on:
    - write_act_3
    nodes_dependent_on: []
    prompt: Write closing credits sequence description blending gangster and hairdressing
      motifs. Include character fates, on-screen text credits with special formatting,
      and final musical cue.
  describe_salon_setting:
    agent: false
    description: Create detailed environment description for the hair salon
    name: describe_salon_setting
    nodes_depended_on: []
    nodes_dependent_on:
    - write_act_1
    - write_scenes_salon_exterior
    prompt: Describe the physical layout of Tony's hair salon ("Little Tony's Chop
      Shop"). Include mafia-themed elements mixed with barber shop kitsch, client
      demographics, and technical equipment.
  establish_tony_backstory:
    agent: false
    description: Develop Tony's motivation for becoming a hairdresser while retaining
      his criminal persona
    name: establish_tony_backstory
    nodes_depended_on: []
    nodes_dependent_on:
    - write_plot_outline
    - create_character_profiles
    prompt: Generate a 200-word backstory explaining how and why Tony Soprano (his
      criminal identity intact) transitions to becoming a hairdresser. Include specific
      triggers and internal conflicts.
  write_act_1:
    agent: false
    description: Compose screenplay content for Act 1
    name: write_act_1
    nodes_depended_on:
    - write_plot_outline
    - describe_salon_setting
    - create_character_profiles
    nodes_dependent_on:
    - write_act_2
    - write_scenes_salon_exterior
    prompt: Write Act 1 of the screenplay (15-20 pages), showing Tony's initiation
      into hairdressing. Include 3-4 key scenes with dialogue and gangster-themed
      salon rituals.
  write_act_2:
    agent: false
    description: Compose screenplay content for Act 2
    name: write_act_2
    nodes_depended_on:
    - write_act_1
    - write_plot_outline
    nodes_dependent_on:
    - write_act_3
    - write_dialogue_tony
    prompt: Write Act 2 of the screenplay (30-40 pages) focusing on business challenges
      and mafia interference. Include 4-6 key scenes showing Tony balancing his dual
      identities.
  write_act_3:
    agent: false
    description: Compose screenplay content for Act 3
    name: write_act_3
    nodes_depended_on:
    - write_act_2
    - write_plot_outline
    nodes_dependent_on: []
    prompt: Write Act 3 of the screenplay (20-25 pages) resolving internal conflicts.
      Include 3-5 climactic scenes showing the fusion of mafia operations and hairdressing
      business.
  write_dialogue_clients:
    agent: false
    description: Client character dialogue sequences
    name: write_dialogue_clients
    nodes_depended_on:
    - create_character_profiles
    nodes_dependent_on:
    - write_act_2
    prompt: Write sample dialogue for 4-6 client characters in various scenarios (bookings,
      conflicts, eavesdropping on criminal plot). Maintain distinct voices for each
      client archetype.
  write_dialogue_tony:
    agent: false
    description: Specialized Tony Soprano dialogue sequences
    name: write_dialogue_tony
    nodes_depended_on:
    - create_character_profiles
    nodes_dependent_on:
    - write_act_2
    - write_act_3
    prompt: Write 10-12 lines of signature Tony Soprano dialogue demonstrating his
      typical syntax, attitude, and references to both mafia operations and hairdressing
      metaphors.
  write_plot_outline:
    agent: false
    description: Structure the screenplay into 3 acts with major plot points
    name: write_plot_outline
    nodes_depended_on: []
    nodes_dependent_on:
    - write_title_screen
    - write_act_1
    - write_act_2
    - write_act_3
    prompt: Create a three-act story structure for Tony Soprano transitioning into
      hairdressing. Include mafia conflicts, salon business challenges, and character
      arcs in each act.
  write_scenes_salon_exterior:
    agent: false
    description: Specific exterior/location shoot scene descriptions
    name: write_scenes_salon_exterior
    nodes_depended_on:
    - describe_salon_setting
    nodes_dependent_on:
    - write_act_1
    prompt: Write 5 exterior salon scene descriptions (day/night) showing interactions
      between customers, Tony's crew members, and rival salon crews. Include location
      details and crowd behavior.
  write_title_screen:
    agent: false
    description: Craft title treatment and opening credits
    name: write_title_screen
    nodes_depended_on:
    - write_plot_outline
    nodes_dependent_on: []
    prompt: Write a title sequence description for a mafia-themed hairdressing movie.
      Include visual motifs, music style, and on-screen text treatment blending criminal
      and beauty industry elements.
